name: Kami release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kami-upstream-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'eightHundreds/Kami'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.KAMI_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KAMI_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAMI_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAMI_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check out Kami configuration
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Find unreleased upstream version
        if: steps.signing.outputs.configured == 'true'
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(curl -fsSL https://api.github.com/repos/wangzan101/Mika/releases/latest)"
          tag="$(jq -r .tag_name <<<"$release")"
          body="$(jq -r .body <<<"$release")"
          if [[ -z "$tag" || "$tag" == "null" ]]; then echo "Upstream has no stable release" >&2; exit 1; fi
          delimiter="kami_notes_$(openssl rand -hex 12)"
          { echo "body<<$delimiter"; printf '%s\n' "$body"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          released=false
          while IFS= read -r existing; do
            if [[ "$existing" == "$tag" || "$existing" == "$tag."* ]]; then released=true; break; fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName')
          if [[ "$released" == true ]]; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $tag is already represented by a Kami release."
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync fork and check out upstream release
        if: steps.signing.outputs.configured == 'true' && steps.upstream.outputs.new_release == 'true'
        id: source
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/kami/prepare_release.py "$RUNNER_TEMP/prepare_release.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wangzan101/Mika.git
          git fetch upstream main --tags
          git checkout main
          base_sha="$(git rev-parse HEAD)"
          # Preserve Kami's Actions files; GITHUB_TOKEN cannot push changes under .github/workflows.
          git merge --no-ff --no-commit upstream/main
          git restore --source="$base_sha" --staged --worktree -- .github/workflows
          git commit -m "Merge upstream/main while preserving Kami workflows"
          git push origin HEAD:main
          upstream_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git checkout --detach "$upstream_sha"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.upstream.outputs.new_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Kami identity to upstream release
        if: steps.upstream.outputs.new_release == 'true'
        id: prepare
        env:
          KAMI_SOURCE_DIR: ${{ github.workspace }}
          KAMI_RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: python3 "$RUNNER_TEMP/prepare_release.py"

      - name: Build release APKs
        if: steps.upstream.outputs.new_release == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign and verify APKs
        if: steps.upstream.outputs.new_release == 'true'
        env:
          KAMI_KEYSTORE: ${{ secrets.KAMI_SIGNING_KEYSTORE_BASE64 }}
          KAMI_STORE_PASSWORD: ${{ secrets.KAMI_SIGNING_STORE_PASSWORD }}
          KAMI_KEY_ALIAS: ${{ secrets.KAMI_SIGNING_KEY_ALIAS }}
          KAMI_KEY_PASSWORD: ${{ secrets.KAMI_SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/kami-release.p12"
          assets="$RUNNER_TEMP/kami-release-assets"
          mkdir -p "$assets"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KAMI_KEYSTORE" | base64 --decode > "$key"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          universal="$(find app/build/outputs/apk/release -maxdepth 1 -name '*universal*.apk' -print -quit)"
          arm64="$(find app/build/outputs/apk/release -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$universal" && test -n "$arm64"
          for kind in universal arm64; do
            if [[ "$kind" == universal ]]; then src="$universal"; out="$assets/Kami-v$VERSION.apk"; else src="$arm64"; out="$assets/Kami-v$VERSION-arm64.apk"; fi
            aligned="$RUNNER_TEMP/aligned-$kind.apk"
            "$tools/zipalign" -f -p 4 "$src" "$aligned"
            "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KAMI_KEY_ALIAS" --ks-pass env:KAMI_STORE_PASSWORD --key-pass env:KAMI_KEY_PASSWORD --out "$out" "$aligned"
            "$tools/apksigner" verify --verbose "$out"
          done

      - name: Publish Kami release
        if: steps.upstream.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
          BODY: ${{ steps.upstream.outputs.body }}
          SHA: ${{ steps.source.outputs.sha }}
          ASSETS: ${{ runner.temp }}/kami-release-assets
        run: |
          gh release create "$TAG" "$ASSETS/Kami-v$VERSION.apk" "$ASSETS/Kami-v$VERSION-arm64.apk" --repo "$GITHUB_REPOSITORY" --title "Kami $VERSION" --notes "$BODY" --target "$SHA"
